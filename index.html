<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Arcade Soccer has moved</title>

<!-- This repo exists only to keep the old GitHub Pages URL alive. The game
     was renamed Fable-5-Soccer-Game -> arcade-soccer, and GitHub does not
     redirect Pages project sites across a rename, so every link already out
     in the world (resumes, applications, messages) would 404. The real
     project lives at github.com/iamsorenl/arcade-soccer. -->

<link rel="canonical" href="https://iamsorenl.github.io/arcade-soccer/">
<meta http-equiv="refresh" content="0; url=https://iamsorenl.github.io/arcade-soccer/">
<meta name="robots" content="noindex">

<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #0d1117; color: #e6edf3; text-align: center; padding: 24px;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1.25rem; color: #9da7b3; }
  a.go {
    display: inline-block; padding: 10px 18px; border-radius: 8px;
    background: #2f81f7; color: #fff; text-decoration: none; font-weight: 600;
  }
  a.go:hover { background: #4a94f8; }
  code { color: #9da7b3; font-size: .85rem; }
</style>
</head>
<body>
  <main>
    <h1>Arcade Soccer moved</h1>
    <p>This game used to live at <code>Fable-5-Soccer-Game</code>.<br>Taking you there now.</p>
    <a class="go" id="go" href="https://iamsorenl.github.io/arcade-soccer/">Go to Arcade Soccer</a>
  </main>
<script>
  // Carry any deep path/query/hash across instead of dumping everyone on the
  // root. The meta refresh above already fires; this only sharpens the target
  // and covers the case where the old link pointed somewhere specific.
  (function () {
    var base = 'https://iamsorenl.github.io/arcade-soccer/';
    var tail = location.pathname.replace(/^\/Fable-5-Soccer-Game\/?/, '') +
               location.search + location.hash;
    var target = base + tail;
    document.getElementById('go').href = target;
    location.replace(target);
  })();
</script>
</body>
</html>
